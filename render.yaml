services:
  - type: web
    name: ask-rohit
    runtime: python
    buildCommand: bash build.sh
    startCommand: python app.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: NOTIFY_TO_EMAIL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
